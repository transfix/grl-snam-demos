name: pages

# The GRL-SNAM site (https://transfix.github.io/grl-snam-demos/), built from CVC-Lab/GRL-SNAM's main
# branch, which is authoritative, and deployed as a Pages artifact (nothing is committed to a
# branch). The pattern is libcvc's deploy-pages.yml.
#
#   1. Check out GRL-SNAM (GRL_SNAM_REF) and libcvc at the pinned tag (LIBCVC_REF).
#   2. Build libcvc's ariglx-web (CPython 3.12, pycvc, pycvc_gl and numpy in WebAssembly) with
#      GRL-SNAM's pages/build-ariglx-web.sh, which runs the recipe's own build-wasm.sh: the
#      single-threaded build, since Pages sends no COOP/COEP headers, and the lean tier (no
#      vtk-python). It is not on cvcpkg.org. About 30 minutes, so it is cached by libcvc's commit
#      and that script.
#   3. GRL-SNAM's `pages/assemble.py --learn-only` writes the learn page: `grl-snam ariadne learn` on
#      ariglx-web, with its ariadne.config.json and every file it preloads (LEARN_HISTORIES).
#      `--scrub-only` writes the scrub page: `grl-snam ariadne scrub --view` on the learning
#      check's three retrains, every checkpoint deployed here, natively (that needs torch and
#      libcvc's sim_world: a cvcpkg closure whose libcvc family is pinned to LIBCVC_REF's version,
#      the one ariglx-web is built from, and the checkpoints from the cvcpkg package
#      grl-snam-learning-checkpoints; the runs are cached), on libcvc's generated city.
#      `--scrub-only --scrub-world data` writes the scrub page in Austin, scrub-austin/: the same
#      runs deployed there, where the policies were trained (when GRL-SNAM's assemble.py has
#      --scrub-austin). Everything a page fetches is on the site's own origin, but the Austin page's
#      city: its data store fetches the cvcpkg package cy-pca/scene-austin-south-small (10 MB) from
#      cvcpkg.org, which lets any origin read a public package.
#   4. tools/assemble.sh puts the site together: the landing page (site/), the July to August 2026
#      archive (archive/2026-08, as published), redirects from the archive pages' old URLs, the
#      libcvc nav demos' thumbnails, learn/, scrub/ and scrub-austin/.
#   5. Headless Chrome loads it as Pages serves it: tools/site_smoke.mjs (every link and file, the
#      landing page under a strict CSP, the archive and its redirects, learn/ and scrub/ running),
#      then GRL-SNAM's own pages/smoke.mjs (learn starts, runs its frames and makes learn-report's
#      claims in the page; scrub starts and shows a checkpoint of the runs deployed here). Node,
#      Chromium and Python come from cvcpkg's catalog.
#   6. Pushes to main, the nightly run and Run workflow deploy it; pull requests stop after the
#      checks and upload the screenshots.
#
# PUBLISH_LEARN, PUBLISH_SCRUB and PUBLISH_SCRUB_AUSTIN say whether the deployed site has learn/,
# scrub/ and scrub-austin/. The pages show the learning check's results, so they go public only on
# Joe's word (all three given); a page not published is still built and checked on every run. While GRL-SNAM has no pages/ scripts at
# GRL_SNAM_REF, the run builds the landing page and the archive alone, with a warning.
#
# Requires Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *' # nightly, ~03:17 America/Chicago: GRL-SNAM's main moves on its own
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The upstream GRL-SNAM ref the site is built from: main, which is authoritative.
  GRL_SNAM_REF: main
  # The libcvc release the pages run on: ariglx-web is built from this tag, and the scrub page's
  # runs are deployed with the catalog's libcvc of the same version (pinned below), since the page
  # builds libcvc's generated world again with its own generator. 4.0.7: Ariadne's chart: widget
  # (libcvc#1169, 3.7.14+), so learn and scrub draw charts, and arigl-web fetches a download that
  # broke off again past the browser's cache (libcvc#1505: Firefox's "Error in input stream").
  LIBCVC_REF: v4.0.7
  # The histories the learn page shows, paths in the GRL-SNAM checkout (.jsonl or .jsonl.gz; their
  # basenames differ, since learn labels each run by its file stem). Empty: assemble.py's default,
  # the learning check's five retrain seeds (docs/learning-validation/retrain/seed*.history.jsonl.gz).
  LEARN_HISTORIES: ''
  # 'yes' puts learn/ on the deployed site (Joe, 2026-11-14: the five retrain seeds as they are).
  PUBLISH_LEARN: 'yes'
  # 'yes' puts scrub/ on the deployed site (Joe, 2026-11-15).
  PUBLISH_SCRUB: 'yes'
  # 'yes' puts scrub-austin/ on the deployed site (Joe, 2026-11-24: Austin as a second page beside
  # scrub/).
  PUBLISH_SCRUB_AUSTIN: 'yes'

jobs:
  build:
    name: build and check the site
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out CVC-Lab/GRL-SNAM at ${{ env.GRL_SNAM_REF }}
        uses: actions/checkout@v4
        with:
          repository: CVC-Lab/GRL-SNAM
          ref: ${{ env.GRL_SNAM_REF }}
          path: upstream/grl-snam

      - name: Check out libcvc at ${{ env.LIBCVC_REF }}
        uses: actions/checkout@v4
        with:
          repository: transfix/libcvc
          ref: ${{ env.LIBCVC_REF }}
          path: upstream/libcvc

      - name: What the site is built from
        id: src
        run: |
          echo "grl_snam=$(git -C upstream/grl-snam rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "libcvc=$(git -C upstream/libcvc rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          learn=false
          if [ -f upstream/grl-snam/pages/build-ariglx-web.sh ] && [ -f upstream/grl-snam/pages/assemble.py ]; then
            learn=true
          else
            echo "::warning::GRL-SNAM ${GRL_SNAM_REF} has no pages/ scripts: the site is built without learn/"
          fi
          echo "learn=$learn" >> "$GITHUB_OUTPUT"
          scrub=false
          if [ "$learn" = true ] && grep -q -- '--scrub-only' upstream/grl-snam/pages/assemble.py; then
            scrub=true
          fi
          echo "scrub=$scrub" >> "$GITHUB_OUTPUT"
          austin=false
          if [ "$scrub" = true ] && grep -q -- '--scrub-austin' upstream/grl-snam/pages/assemble.py; then
            austin=true
          fi
          echo "austin=$austin" >> "$GITHUB_OUTPUT"
          git -C upstream/grl-snam log -1 --format='GRL-SNAM %h %s'
          git -C upstream/libcvc log -1 --format='libcvc %h %s'

      - name: Install cvcpkg, then Python, Node and headless Chromium from the catalog
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          T="$RUNNER_TEMP/tools"
          cvcpkg install python312 nodejs22 playwright-chromium-headless-shell --platform linux \
            --prefix "$T" --config release --link shared --no-fallback-to-source
          chrome=$(ls "$T"/share/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          "$chrome" --version
          "$T/bin/node" --version
          "$T/bin/python3.12" --version
          {
            echo "CHROME=$chrome"
            echo "NODE=$T/bin/node"
            echo "PYTHON=$T/bin/python3.12"
          } >> "$GITHUB_ENV"

      - name: Restore ariglx-web
        if: steps.src.outputs.learn == 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ariglx-web
          key: ariglx-web-wasm-lean-${{ steps.src.outputs.libcvc }}-${{ hashFiles('upstream/grl-snam/pages/build-ariglx-web.sh') }}

      - name: Build ariglx-web (wasm, lean) with its recipe's script
        if: steps.src.outputs.learn == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          bash upstream/grl-snam/pages/build-ariglx-web.sh upstream/libcvc "$RUNNER_TEMP/ariglx-web-work" ariglx-web
          rm -rf "$RUNNER_TEMP/ariglx-web-work"

      - name: Save ariglx-web
        # Saved now rather than at the end of the job, so a failed check does not cost the next
        # run the build.
        if: steps.src.outputs.learn == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ariglx-web
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The scrub page's runs are deployed here: a deploy reads numpy, torch, pycvc and pycvc_gl,
      # whose libcvc family is pinned to LIBCVC_REF's version (the catalog's newest libcvc may be
      # another, whose generator would not build the world the page draws), and the learning
      # check's checkpoints (not in any repo).
      - name: Install the deploy's closure via cvcpkg, libcvc pinned to LIBCVC_REF
        if: steps.src.outputs.scrub == 'true'
        id: deps
        run: |
          set -euo pipefail
          v="${LIBCVC_REF#v}"
          prefix="$RUNNER_TEMP/closure"
          cvcpkg install python312 numpy-cp312 torch-cp312 "libcvc==$v" "cvcgl==$v" \
            "pycvc-cp312==$v" "pycvc-gl-cp312==$v" --platform linux --prefix "$prefix" \
            --config release --link shared --no-fallback-to-source
          # The Humvee's glTF the scrub page draws its cars with: GRL-SNAM's assemble ships it from
          # --python's prefix (share/cvc-scenes/shared/Humvee.glb, CC BY 4.0, credited in the
          # page's THIRD_PARTY_NOTICES.md); without it the cars are boxes.
          cvcpkg install vehicle-humvee --prefix "$prefix" --platform any --config release \
            --link shared --no-fallback-to-source
          ls "$prefix"/lib/libcvc.so.* | head -3
          echo "path=$prefix" >> "$GITHUB_OUTPUT"

      - name: Install the learning check's checkpoints (grl-snam-learning-checkpoints)
        if: steps.src.outputs.scrub == 'true'
        run: |
          cvcpkg install grl-snam-learning-checkpoints --prefix "$RUNNER_TEMP/checkpoints" \
            --platform any --config release --link shared --no-fallback-to-source
          echo "CHECKPOINTS=$RUNNER_TEMP/checkpoints/share/grl-snam-learning-checkpoints" >> "$GITHUB_ENV"

      - name: Cache the scrub page's runs
        if: steps.src.outputs.scrub == 'true'
        uses: actions/cache@v4
        with:
          path: scrub-runs
          key: scrub-runs-${{ env.LIBCVC_REF }}-${{ hashFiles('upstream/grl-snam/grl_snam/**', 'upstream/grl-snam/docs/learning-validation/**', 'upstream/grl-snam/cvcpkg/recipes/grl-snam-learning-checkpoints/**') }}

      - name: Cache the Austin scrub page's runs
        if: steps.src.outputs.austin == 'true'
        uses: actions/cache@v4
        with:
          path: scrub-runs-austin
          key: scrub-runs-austin-${{ env.LIBCVC_REF }}-${{ hashFiles('upstream/grl-snam/grl_snam/**', 'upstream/grl-snam/docs/learning-validation/**', 'upstream/grl-snam/cvcpkg/recipes/grl-snam-learning-checkpoints/**') }}

      - name: Assemble the site
        env:
          PREFIX: ${{ steps.deps.outputs.path }}
        run: |
          set -euo pipefail
          pages=()
          if [ "${{ steps.src.outputs.learn }}" = true ]; then
            hist=()
            for h in $LEARN_HISTORIES; do hist+=("upstream/grl-snam/$h"); done
            "$PYTHON" upstream/grl-snam/pages/assemble.py --host ariglx-web/share/ariglx-web \
              --learn-only --out "$RUNNER_TEMP/learn" ${hist[@]:+--histories "${hist[@]}"}
            pages+=(--learn "$RUNNER_TEMP/learn")
          fi
          if [ "${{ steps.src.outputs.scrub }}" = true ]; then
            test -n "$PREFIX" || { echo "::error::no deploy closure"; exit 1; }
            expect=()  # GRL-SNAM's assemble refuses runs deployed on another libcvc than the page's
            if grep -q -- '--expect-libcvc' upstream/grl-snam/pages/assemble.py; then
              expect=(--expect-libcvc "$LIBCVC_REF")
            fi
            "$PYTHON" upstream/grl-snam/pages/assemble.py --host ariglx-web/share/ariglx-web \
              --scrub-only --out "$RUNNER_TEMP/scrub" --python "$PREFIX/bin/python3.12" \
              --checkpoints "$CHECKPOINTS" --scrub-cache scrub-runs "${expect[@]}"
            pages+=(--scrub "$RUNNER_TEMP/scrub")
          fi
          if [ "${{ steps.src.outputs.austin }}" = true ]; then
            # The same runs deployed in Austin (scrub.ari's data.city), a page of their own.
            "$PYTHON" upstream/grl-snam/pages/assemble.py --host ariglx-web/share/ariglx-web \
              --scrub-only --scrub-world data --out "$RUNNER_TEMP/scrub-austin" \
              --python "$PREFIX/bin/python3.12" --checkpoints "$CHECKPOINTS" \
              --scrub-cache scrub-runs-austin "${expect[@]}"
            pages+=(--scrub-austin "$RUNNER_TEMP/scrub-austin")
          fi
          bash tools/assemble.sh --out _site_full --grl-snam upstream/grl-snam \
            --libcvc upstream/libcvc "${pages[@]}"
          python3 -c "import json; b = json.load(open('_site_full/build.json')); print({k: v for k, v in b.items() if k not in ('learn', 'scrub')})"

      - name: Load the site in headless Chrome
        run: |
          # GRL-SNAM's launcher (pages/main.py) says on stderr when the port is running.
          "$NODE" tools/site_smoke.mjs --site _site_full --chrome "$CHROME" --shots shots --external \
            --learn-expect '^grl-snam: learn: running' --scrub-expect '^grl-snam: scrub: running' \
            --scrub-austin-expect '^grl-snam: scrub: running'

      - name: Run GRL-SNAM's learn and scrub checks on it
        if: steps.src.outputs.learn == 'true'
        run: |
          # --no-landing: the landing page is this repo's, checked above.
          scrub=()
          if [ -d _site_full/scrub ]; then scrub=(--scrub scrub/); fi
          # The Austin page fetches its city from cvcpkg.org: --city-scrub lets it, and it alone.
          if [ -d _site_full/scrub-austin ]; then scrub+=(--city-scrub scrub-austin/); fi
          "$NODE" upstream/grl-snam/pages/smoke.mjs --site _site_full --chrome "$CHROME" \
            --base /grl-snam-demos/ --learn learn/ "${scrub[@]}" --no-landing --shots shots/grl-snam

      - name: The site to deploy
        run: |
          held=0 pub=()
          if [ -d _site_full/learn ]; then
            if [ "$PUBLISH_LEARN" = yes ]; then pub+=(--learn "$RUNNER_TEMP/learn"); else held=1; fi
          fi
          if [ -d _site_full/scrub ]; then
            if [ "$PUBLISH_SCRUB" = yes ]; then pub+=(--scrub "$RUNNER_TEMP/scrub"); else held=1; fi
          fi
          if [ -d _site_full/scrub-austin ]; then
            if [ "$PUBLISH_SCRUB_AUSTIN" = yes ]; then
              pub+=(--scrub-austin "$RUNNER_TEMP/scrub-austin")
            else
              held=1
            fi
          fi
          if [ "$held" = 0 ]; then
            mv _site_full _site
          else
            # A page not published stays off the public site: the rest, checked again.
            bash tools/assemble.sh --out _site --grl-snam upstream/grl-snam --libcvc upstream/libcvc \
              "${pub[@]}"
            "$NODE" tools/site_smoke.mjs --site _site --chrome "$CHROME"
          fi
          du -sh _site
          {
            echo "### The site"
            echo
            echo "- GRL-SNAM: \`${{ steps.src.outputs.grl_snam }}\` (${GRL_SNAM_REF})"
            echo "- libcvc: \`${{ steps.src.outputs.libcvc }}\` (${LIBCVC_REF})"
            echo "- learn/ built: ${{ steps.src.outputs.learn }}; published: $([ -d _site/learn ] && echo yes || echo no)"
            echo "- scrub/ built: ${{ steps.src.outputs.scrub }}; published: $([ -d _site/scrub ] && echo yes || echo no)"
            echo "- scrub-austin/ built: ${{ steps.src.outputs.austin }}; published: $([ -d _site/scrub-austin ] && echo yes || echo no)"
            echo "- size: $(du -sh _site | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write # deploy the Pages artifact
      id-token: write # the OIDC token actions/deploy-pages verifies the deploy with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live
        # A deploy can take a few minutes to reach the Pages CDN: poll the files this build put
        # there (its build.json names its commit) before failing.
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 24); do
            got=$(curl -fsS "${URL}build.json" 2>/dev/null | grep -o '"site": "[0-9a-f]*"' || true)
            if [ "$got" = "\"site\": \"${GITHUB_SHA}\"" ] &&
               curl -fsSI "${URL}archive/2026-08/" >/dev/null &&
               curl -fsSI "${URL}img/nav_city_swarm.jpg" >/dev/null; then
              echo "live: ${URL} (${got})"
              if curl -fsSI "${URL}learn/ariglx.wasm" >/dev/null 2>&1; then echo "learn/ is live"; fi
              if curl -fsSI "${URL}scrub/ariglx.wasm" >/dev/null 2>&1; then echo "scrub/ is live"; fi
              if curl -fsSI "${URL}scrub-austin/ariglx.wasm" >/dev/null 2>&1; then
                echo "scrub-austin/ is live"
              fi
              exit 0
            fi
            sleep 15
          done
          echo "::error::${URL} does not serve this build after 6 minutes"
          exit 1
